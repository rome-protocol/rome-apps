[package]
name = "rome-via-enrich"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
publish = false

[features]
testnet = ["rome-sdk/testnet"]
mainnet = ["rome-sdk/mainnet"]
ci = ["rome-sdk/ci"]
default = ["ci"]

[[bin]]
name = "rome-via-enrich"
path = "src/main.rs"

[dependencies]
rome-via-classify = { workspace = true }
anyhow = { workspace = true }
# U256 for full-width uint256 Transfer-amount parsing (holders::hex_to_numeric).
ethers = { workspace = true }
clap = { workspace = true, features = ["derive"] }
dotenv = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
rome-obs = { workspace = true }
rome-sdk = { workspace = true, default-features = false }
axum = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
reqwest = { version = "0.12", features = ["json"] }
serial_test = "3"
sha3 = "0.10"
