[package]
name = "cli"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
publish = false

[features]
testnet = ["rome-sdk/testnet", "proxy/testnet"]
mainnet = ["rome-sdk/mainnet", "proxy/mainnet"]
ci = ["rome-sdk/ci", "proxy/ci"]
emulator-rpc = ["rome-sdk/emulator-rpc", "proxy/emulator-rpc"]
default = ["ci"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
ethers = { workspace = true }
rome-sdk = { workspace = true, default-features = false }
hex = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

#solana
solana-client = { workspace = true }
solana-sdk = { workspace = true }
solana-commitment-config = { workspace = true }
spl-token-2022-interface = { workspace = true }
spl-associated-token-account-interface = { workspace = true }
solana-cli-config = { workspace = true }
solana-address-lookup-table-interface = { workspace = true }
proxy = {path = "../proxy", default-features = false}


[build-dependencies]
compile-time = { version = "0.2.0" }